@if (!loading()) {
  <div class="animate__animated animate__fadeIn">
    <div class="p-fluid">
      <div class="formgrid grid">

        <div class="field col-12 md:col-6">
          <label>Purchase Order</label>
          <p-dropdown
            [options]="purchaseOrders()"
            optionLabel="number"
            optionValue="id"
            appendTo="body"
            placeholder="Select a linked PO"
            [ngModel]="selectedPoId()"
            (ngModelChange)="selectPo($event)" />
        </div>

        @if (hasSalesTax()) {
          <div class="field col-12">
            <p-message
              severity="info"
              text="The PO's Sales Tax is imported as a tax record, not as a charge."
              styleClass="w-full" />
          </div>
        }

        <div class="field col-12">
          <p-table
            styleClass="p-datatable-sm"
            [value]="preview()"
            [scrollable]="true"
            scrollHeight="30rem">
            <ng-template pTemplate="header">
              <tr>
                <th style="min-width: 8rem">PO #</th>
                <th style="min-width: 10rem">SOURCE</th>
                <th>DESCRIPTION</th>
                <th style="min-width: 12rem; text-align: right;">VALUE</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-charge>
              <tr>
                <td>{{ charge.poNumber }}</td>
                <td>{{ charge.source.replace('_', ' ') }}</td>
                <td>{{ charge.description }}</td>
                <td style="text-align: end;">{{ charge.value | customCurrency:currency():'1.2-5' }}</td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="4" class="text-center">No charges available in this PO</td>
              </tr>
            </ng-template>
          </p-table>
        </div>

      </div>
    </div>

    <div class="mt-3 flex justify-content-end column-gap-4">
      <button
        pButton
        type="button"
        label="Cancel"
        icon="pi pi-times-circle"
        severity="danger"
        (click)="closeModal()"
        class="p-button-sm">
      </button>
      <button
        pButton
        type="button"
        label="Import all from this PO"
        icon="pi pi-upload"
        [disabled]="!canSubmit()"
        severity="success"
        (click)="onSubmit()"
        class="p-button-sm">
      </button>
    </div>
  </div>
} @else {
  <div class="field col animate__animated animate__fadeIn">
    <p-progressBar class="w-20rem animate__animated animate__fadeIn" mode="indeterminate"></p-progressBar>
  </div>
}

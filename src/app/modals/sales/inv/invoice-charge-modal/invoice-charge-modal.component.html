@if (formCharge) {
  <form [formGroup]="formCharge" (ngSubmit)="onSubmit()">
    <div class="p-fluid">
      <div class="formgrid grid">

        <div class="field col-12">
          <label>
            Description
            <span class="required">*</span>
          </label>
          <input pInputText type="text" formControlName="description" maxlength="100" />
        </div>

        <div class="field col-12 md:col-6">
          <label>
            Type
            <span class="required">*</span>
          </label>
          <p-dropdown
            formControlName="type"
            [options]="listChargeType()"
            optionLabel="value"
            optionValue="key"
            appendTo="body"
            placeholder="Select Type" />
        </div>

        <div class="field col-12 md:col-6">
          <label>
            Value
            <span class="required">*</span>
          </label>
          <p-inputNumber
            [inputStyle]="{ 'text-align': 'right' }"
            mode="currency"
            [currency]="currency()"
            currencyDisplay="code"
            [minFractionDigits]="5"
            [maxFractionDigits]="5"
            [min]="-999999999999"
            [max]="999999999999"
            formControlName="value" />
        </div>

      </div>
    </div>

    @if (loading()) {
      <div class="field col animate__animated animate__fadeIn">
        <p-progressBar class="w-20rem animate__animated animate__fadeIn" mode="indeterminate"></p-progressBar>
      </div>
    } @else {
      <div class="mt-3 flex justify-content-end column-gap-4">
        <p-button
          icon="pi pi-times-circle"
          styleClass="p-button-sm p-button-danger"
          label="Cancel"
          (onClick)="closeModal()">
        </p-button>
        <button
          pButton
          type="submit"
          label="Save"
          icon="pi pi-save"
          [disabled]="formCharge.invalid"
          class="p-button-sm p-button-success">
        </button>
      </div>
    }
  </form>
}

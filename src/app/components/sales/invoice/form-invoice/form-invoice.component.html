@if (loading()) {
  <div class="w-full">
    <p-progressBar mode="indeterminate" [style]="{ height: '6px' }" />
  </div>
} @else if (formTab && showForm) {
  <div [class]="'p-fluid w-full animate__animated animate__' + animation">

    @if (!isValidOpen()) {
      <p-message
        severity="warn"
        text="This invoice is open by another user, it is available in read-only mode."
        styleClass="w-full mb-3" />
    } @else if (!isCreate() && !isDraft()) {
      <p-message
        severity="info"
        text="Only draft invoices can be edited."
        styleClass="w-full mb-3" />
    }

    <form [formGroup]="formTab" (ngSubmit)="onSubmit()">
      <div class="formgrid grid mt-1">

        <div class="field col-12 md:col-2 lg:col-2 xl:col-2">
          <app-invoice-summary-section
            [group]="formTab"
            [statusList]="listInvoiceStatus()"
            [invoice]="item()"
            [currency]="invoiceCurrency()" />
        </div>

        <div class="field col-12 md:col-3 lg:col-3 xl:col-3">
          <app-invoice-client-section
            [group]="formTab"
            [clients]="filteredClients"
            [contacts]="listClientContact()"
            (searchClient)="searchClient($event)"
            (clientSelected)="changeClient($event)"
            (clientCleared)="clearClient()" />
        </div>

        <div class="field col-12 md:col-3 lg:col-3 xl:col-3">
          <app-invoice-shipto-section
            [group]="formTab"
            [cities]="filteredCities"
            [canCopyFromClient]="canEdit() && !isCreate()"
            (searchCity)="searchCity($event)"
            (copyFromClient)="copyShipToFromClient()" />
        </div>

        <div class="field col-12 md:col-4 lg:col-4 xl:col-4">
          <app-invoice-terms-section
            [group]="formTab"
            [currencyList]="listCurrency()"
            [incotermsList]="listIncoterms()"
            [viaList]="listVia()"
            [paymentTermsList]="listPaymentTerms()"
            [employees]="listEmployees()" />
        </div>

        @if (department() === 'IP') {
          <div class="col-12 md:col-12 mt-1">
            <div class="formgrid grid">
              <div class="field col-12 md:col-5 mt-1"></div>
              <div class="field col-12 md:col-4 mt-1">
                <app-invoice-po-section
                  [purchaseOrders]="linkedPurchaseOrders()"
                  [canEdit]="canEditProducts()"
                  [loading]="loading()"
                  (openPo)="openPo($event)"
                  (removePo)="removePo($event)" />
              </div>
              <div class="field col-12 md:col-1 mt-1"></div>
              <div class="field col-12 md:col-2 mt-1">
                <button pButton
                  label="Associate PO"
                  icon="pi pi-plus"
                  severity="success"
                  [outlined]="true"
                  (click)="associatePo()"
                  [disabled]="!canEditProducts()"
                  type="button">
                </button>
              </div>
            </div>
          </div>

          <div class="col-12 md:col-12 mt-1">
            <div class="formgrid grid">
              <div class="col-12 md:col-10">
                <app-invoice-products-section
                  [products]="listProducts()"
                  [canEdit]="canEditProducts()"
                  [loading]="loading()"
                  (editProduct)="openEditProductDialog($event)"
                  (removeProduct)="removeProduct($event)"
                  (viewProduct)="viewProduct($event)" />
              </div>
              <div class="col-12 md:col-2">
                <div class="formgrid grid">
                  <div class="field col-12 md:col-12 mt-3">
                    <button pButton
                      label="Add Product"
                      icon="pi pi-plus"
                      severity="success"
                      [outlined]="true"
                      (click)="openAddProductModal()"
                      [disabled]="!canEditProducts()"
                      type="button">
                    </button>
                  </div>
                </div>
                <app-invoice-totals-section
                  [productsTotal]="item()?.productsTotal ?? 0"
                  [chargesTotal]="item()?.chargesTotal ?? 0"
                  [taxesTotal]="item()?.taxesTotal ?? 0"
                  [totalAmount]="item()?.totalAmount ?? 0"
                  [currency]="invoiceCurrency()" />
              </div>
            </div>
          </div>
        }

        <div class="col-12 md:col-12 mt-1">
          <div class="formgrid grid">
            <div class="field col-12 md:col-5 mt-1">
              <p-tabView>
                <p-tabPanel header="Remarks">
                  <textarea
                    [rows]="6"
                    pInputTextarea
                    style="resize: none"
                    placeholder="Remarks"
                    formControlName="remarks">
                  </textarea>
                </p-tabPanel>
                <p-tabPanel header="Internal Remarks">
                  <textarea
                    [rows]="6"
                    pInputTextarea
                    style="resize: none"
                    placeholder="Internal Remarks"
                    formControlName="internalRemarks">
                  </textarea>
                </p-tabPanel>
              </p-tabView>
            </div>
            <div class="field col-12 md:col-3 mt-3">
              @if (canEdit()) {
                <button pButton
                  label="Save"
                  icon="pi pi-save"
                  severity="success"
                  [disabled]="formTab.disabled || formTab.invalid || tabItem.pristine"
                  type="submit">
                </button>
              }
            </div>
          </div>
        </div>

      </div>
    </form>
  </div>

  <p-dialog
    header="ASSOCIATE PO"
    [(visible)]="showAssociatePoDialog"
    [modal]="true"
    [style]="{ width: '25rem' }">
    <div class="field">
      <label>Purchase Order id</label>
      <input pInputText type="text" [ngModel]="associatePoId()" (ngModelChange)="associatePoId.set($event)" class="w-full"/>
    </div>
    <ng-template pTemplate="footer">
      <button pButton type="button" label="Cancel" class="p-button-text" (click)="showAssociatePoDialog.set(false)"></button>
      <button pButton type="button" label="Associate" icon="pi pi-link" (click)="confirmAssociatePo()"></button>
    </ng-template>
  </p-dialog>

  <p-dialog
    header="EDIT PRODUCT"
    [(visible)]="showEditProductDialog"
    [modal]="true"
    [style]="{ width: '25rem' }">
    <div class="field">
      <label>Quantity</label>
      <input pInputText type="number" min="0" [ngModel]="editProductQuantity()" (ngModelChange)="editProductQuantity.set($event)" class="w-full"/>
    </div>
    <div class="field">
      <label>Profit Margin</label>
      <input pInputText type="number" min="0" [ngModel]="editProductMargin()" (ngModelChange)="editProductMargin.set($event)" class="w-full"/>
    </div>
    <div class="field">
      <label>Condition</label>
      <input pInputText type="text" [ngModel]="editProductCondition()" (ngModelChange)="editProductCondition.set($event)" class="w-full"/>
    </div>
    <ng-template pTemplate="footer">
      <button pButton type="button" label="Cancel" class="p-button-text" (click)="showEditProductDialog.set(false)"></button>
      <button pButton type="button" label="Save" icon="pi pi-save" (click)="confirmEditProduct()"></button>
    </ng-template>
  </p-dialog>
}

@if (loading()) {
  <div class="w-full">
    <p-progressBar mode="indeterminate" [style]="{ height: '6px' }" />
  </div>
} @else {
  <div class="p-fluid w-full animate__animated animate__fadeIn">
    @if (!isValidOpen()) {
      <p-message
        severity="warn"
        text="This invoice is open by another user, it is available in read-only mode."
        styleClass="w-full mb-3" />
    }
    <div class="flex flex-column align-items-center justify-content-center" style="min-height: 20rem;">
      <i class="pi pi-receipt" style="font-size: 2.5rem; opacity: 0.35;"></i>
      <h5 class="mt-3 mb-1">{{ item()?.name }}</h5>
      <span class="text-color-secondary">The invoice form is not available yet.</span>
    </div>
  </div>
}

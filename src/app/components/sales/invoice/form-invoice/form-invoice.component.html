@if (loading()) {
  <div class="w-full">
    <p-progressBar mode="indeterminate" [style]="{ height: '6px' }" />
  </div>
} @else if (formTab && showForm) {
  <div [class]="'p-fluid w-full animate__animated animate__' + animation">

    @if (!isValidOpen()) {
      <p-message
        severity="warn"
        text="This invoice is open by another user, it is available in read-only mode."
        styleClass="w-full mb-3" />
    } @else {
      <!-- Nested instead of `@else if (...; as ...)`: the `as` alias is only
           allowed on the primary @if block. -->
      @if (editNotice(); as notice) {
        <p-message
          [severity]="notice.severity"
          [text]="notice.text"
          styleClass="w-full mb-3" />
      }
    }

    @if (!isCreate()) {
      <!-- `tabItem.pristine` is a plain property, not a signal: it is combined
           here instead of inside canIssue() so a computed never caches a stale
           value. Issuing an invoice with unsaved header changes would freeze the
           total over data the server has not seen. -->
      <app-invoice-actions-section
        class="block mb-3"
        [canIssue]="canIssue()"
        [issueEnabled]="issueReady() && tabItem.pristine"
        [canRevert]="canRevert()"
        [canCancel]="canCancel()"
        [canDelete]="canDelete()"
        [deleteLocked]="deleteLocked()"
        [canClone]="canClone()"
        [canViewHistory]="canViewHistory()"
        [canPrint]="canPrint()"
        [printEnabled]="printReady() && tabItem.pristine"
        [canSend]="canSend()"
        [sendEnabled]="printReady() && tabItem.pristine"
        [draftPdf]="isDraft()"
        [loadingDownload]="loadingDownload()"
        [loadingSend]="loadingPrintAndSent()"
        (issue)="issueInvoice()"
        (revert)="revertToDraft()"
        (cancel)="cancelInvoice()"
        (remove)="deleteInvoice()"
        (clone)="cloneInvoice()"
        (history)="openHistory()"
        (print)="printInvoice()"
        (printAndSend)="printAndSendInvoice()" />
    }

    <form [formGroup]="formTab" (ngSubmit)="onSubmit()">
      <div class="formgrid grid mt-1">

        <div class="field col-12 md:col-2 lg:col-2 xl:col-2">
          <app-invoice-summary-section [invoice]="item()" />
        </div>

        <div class="field col-12 md:col-3 lg:col-3 xl:col-3">
          <app-invoice-client-section
            [group]="formTab"
            [clients]="filteredClients"
            [contacts]="listClientContact()"
            (searchClient)="searchClient($event)"
            (clientSelected)="changeClient($event)"
            (clientCleared)="clearClient()" />
        </div>

        <div class="field col-12 md:col-3 lg:col-3 xl:col-3">
          <app-invoice-shipto-section
            [group]="formTab"
            [cities]="filteredCities"
            [canCopyFromClient]="canEdit() && !isCreate()"
            (searchCity)="searchCity($event)"
            (copyFromClient)="copyShipToFromClient()" />
        </div>

        <div class="field col-12 md:col-4 lg:col-4 xl:col-4">
          <app-invoice-terms-section
            [group]="formTab"
            [currencyList]="listCurrency()"
            [incotermsList]="listIncoterms()"
            [viaList]="listVia()"
            [paymentTermsList]="listPaymentTerms()"
            [employees]="listEmployees()" />
        </div>

        @if (department() === 'IP') {
          <div class="col-12 md:col-12 mt-1">
            <div class="formgrid grid">
              <div class="field col-12 md:col-5 mt-1"></div>
              <div class="field col-12 md:col-4 mt-1">
                <app-invoice-po-section
                  [purchaseOrders]="linkedPurchaseOrders()"
                  [canEdit]="canEditProducts()"
                  [loading]="loading()"
                  (openPo)="openPo($event)"
                  (removePo)="removePo($event)" />
              </div>
              <div class="field col-12 md:col-1 mt-1"></div>
              <div class="field col-12 md:col-2 mt-1">
                <button pButton
                  label="Associate PO"
                  icon="pi pi-link"
                  severity="success"
                  [outlined]="true"
                  (click)="openLinkPoModal()"
                  [disabled]="!canEditProducts()"
                  type="button">
                </button>
              </div>
            </div>
          </div>

          <div class="col-12 md:col-12 mt-1">
            <div class="formgrid grid">
              <div class="col-12 md:col-10">
                <app-invoice-products-section
                  [products]="listProducts()"
                  [canEdit]="canEditProducts()"
                  [loading]="loading()"
                  (editProduct)="openProductModal('edit', $event)"
                  (removeProduct)="removeProduct($event)"
                  (viewProduct)="viewProduct($event)" />
              </div>
              <div class="col-12 md:col-2">
                <div class="formgrid grid">
                  <div class="field col-12 md:col-12 mt-3">
                    <button pButton
                      label="Add Product"
                      icon="pi pi-plus"
                      severity="success"
                      [outlined]="true"
                      (click)="openProductModal('create')"
                      [disabled]="!canEditProducts()"
                      type="button">
                    </button>
                  </div>
                  <div class="field col-12 md:col-12">
                    <button pButton
                      label="Import from PO"
                      icon="pi pi-upload"
                      severity="info"
                      [outlined]="true"
                      (click)="openImportProductsModal()"
                      [disabled]="!canEditProducts()"
                      type="button">
                    </button>
                  </div>
                </div>
                <app-invoice-totals-section
                  [productsTotal]="item()?.productsTotal ?? 0"
                  [chargesTotal]="item()?.chargesTotal ?? 0"
                  [taxesTotal]="item()?.taxesTotal ?? 0"
                  [totalAmount]="item()?.totalAmount ?? 0"
                  [paidAmount]="item()?.paidAmount ?? 0"
                  [balanceDue]="item()?.balanceDue ?? 0"
                  [showPayments]="showPayments()"
                  [currency]="invoiceCurrency()"
                  (openCharges)="openChargesModal()"
                  (openTaxes)="openTaxesModal()"
                  (openPayments)="openPaymentsModal()" />
              </div>
            </div>
          </div>
        }

        <div class="col-12 md:col-12 mt-1">
          <div class="formgrid grid">
            <div class="field col-12 md:col-5 mt-1">
              <p-tabView>
                <p-tabPanel header="Remarks">
                  <textarea
                    [rows]="6"
                    pInputTextarea
                    style="resize: none"
                    placeholder="Remarks"
                    formControlName="remarks">
                  </textarea>
                </p-tabPanel>
                <p-tabPanel header="Internal Remarks">
                  <textarea
                    [rows]="6"
                    pInputTextarea
                    style="resize: none"
                    placeholder="Internal Remarks"
                    formControlName="internalRemarks">
                  </textarea>
                </p-tabPanel>
              </p-tabView>
            </div>
            <div class="field col-12 md:col-3 mt-3">
              @if (canSubmit()) {
                <button pButton
                  label="Save"
                  icon="pi pi-save"
                  severity="success"
                  [disabled]="formTab.disabled || formTab.invalid || tabItem.pristine"
                  type="submit">
                </button>
              }
            </div>
          </div>
        </div>

      </div>
    </form>
  </div>
}

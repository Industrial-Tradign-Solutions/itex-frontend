<p-scrollPanel [style]="{ width: '100%', height: '19.05rem' }">
  <p-table
    styleClass="p-datatable-sm"
    [value]="purchaseOrders"
    dataKey="id"
    [loading]="loading">
    <ng-template pTemplate="caption">
      <div style="text-align: center !important;">
        <b>PURCHASE ORDERS</b>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>
          <div class="flex justify-content-between">
            #
          </div>
        </th>
        <th>
          <div class="flex justify-content-between"></div>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-po>
      <tr [pSelectableRow]="po">
        <td>
          {{ po.number }}
        </td>
        <td style="text-align: end;">
          <button
            pButton
            type="button"
            icon="pi pi-eye"
            class="p-button-rounded p-button-text"
            pTooltip="View"
            severity="info"
            (click)="openPo.emit(po)"
            tooltipPosition="left">
          </button>
          @if (canEdit) {
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-rounded p-button-text"
              pTooltip="Remove"
              severity="danger"
              (click)="removePo.emit(po)"
              tooltipPosition="right">
            </button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-scrollPanel>

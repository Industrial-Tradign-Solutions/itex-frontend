@if (!loading()) {
  <div class="card animate__animated animate__fadeIn">
    <p-tabView
      [activeIndex]="activeTabIndex()"
      (activeIndexChange)="activeTabIndex.set($event)"
      [scrollable]="true"
      [controlClose]="true"
      (onClose)="closeTab($event)">
      <p-tabPanel header="Invoices">
        <ng-template pTemplate="header">
          <i class="pi pi-receipt"></i>
          <span>Invoices</span>
        </ng-template>
        <ng-template pTemplate="content">
          <app-list-invoice
            (opened)="openTab($event)"
            [permissions]="invoicePermissions">
          </app-list-invoice>
        </ng-template>
      </p-tabPanel>
      <!-- Fixed tab, deliberately outside `tabs()`: the statement is not an
           invoice, holds no lock and must not consume the open-tabs budget. -->
      <p-tabPanel header="Statement">
        <ng-template pTemplate="header">
          <i class="pi pi-chart-bar"></i>
          <span>Statement</span>
        </ng-template>
        <ng-template pTemplate="content">
          <app-statement-invoice (opened)="openTab($event)" />
        </ng-template>
      </p-tabPanel>
      @for (invoiceTab of tabs(); track invoiceTab.item.id) {
        <p-tabPanel [header]="invoiceTab.item.name" [closable]="true">
          <ng-template pTemplate="header">
            <span>{{ invoiceTab.item.name }}</span>
          </ng-template>
          <ng-template pTemplate="content">
            <app-form-invoice
              [index]="$index"
              [tabItem]="invoiceTab"
              [permissions]="invoicePermissions"
              (opened)="openTab($event)"
              (onClose)="closeTabAt($index)">
            </app-form-invoice>
          </ng-template>
        </p-tabPanel>
      }
    </p-tabView>
  </div>
} @else {
  <div style="margin-top: 3rem;">
    <p-skeleton width="100%" styleClass="mb-2"/>
    <p-skeleton width="100%" styleClass="mb-2"/>
    <p-skeleton width="100%" styleClass="mb-2"/>
    <p-skeleton width="100%" styleClass="mb-2"/>
    <p-skeleton width="100%" styleClass="mb-2"/>
  </div>
  <br>
  <p-skeleton width="100%" height="40rem" />
}
